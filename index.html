<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - DeepSeek Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @keyframes pulse-slow {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .animate-pulse-slow {
        animation: pulse-slow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-[#f8f9fa] text-slate-800 h-screen flex flex-col">
    <!-- Header -->
    <header
      class="bg-white border-b border-slate-200 py-3 px-6 flex items-center justify-between shadow-xs z-10"
    >
      <div class="flex items-center space-x-3">
        <div
          class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-semibold text-sm shadow-xs"
        >
          DS
        </div>
        <div>
          <h1 class="font-semibold text-sm text-slate-900 leading-tight">
            Anoman AI Assistant
          </h1>
          <p class="text-xs text-slate-500">Model: deepseek-v4.1-flash</p>
        </div>
      </div>
      <div class="text-xs font-medium text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100">
        ● Online
      </div>
    </header>

    <!-- Main Chat Container -->
    <main
      id="chat-container"
      class="flex-1 overflow-y-auto px-4 py-6 md:px-0 max-w-3xl w-full mx-auto space-y-6"
    >
      <!-- Welcome Message / Initial State -->
      <div class="flex items-start space-x-4 max-w-2xl mx-auto w-full">
        <div
          class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-semibold shrink-0 text-sm"
        >
          AI
        </div>
        <div class="space-y-1 text-sm bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs leading-relaxed">
          <p class="font-medium text-slate-900">Halo! Ada yang bisa saya bantu hari ini?</p>
          <p class="text-slate-600">
            Tuliskan pertanyaan atau perintah Anda di bawah untuk mulai mengobrol.
          </p>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-gradient-to-t from-[#f8f9fa] via-[#f8f9fa] to-transparent pt-4 pb-6 px-4">
      <div class="max-w-3xl mx-auto">
        <form
          id="chat-form"
          class="bg-white border border-slate-300 rounded-2xl shadow-sm focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20 transition-all p-2 flex items-end"
        >
          <textarea
            id="user-input"
            rows="1"
            placeholder="Ketik pesan Anda di sini..."
            class="flex-1 resize-none border-0 bg-transparent focus:ring-0 focus:outline-none text-slate-800 text-sm p-2 max-h-32"
            required
          ></textarea>
          <button
            type="submit"
            id="send-btn"
            class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl p-2.5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shrink-0 ml-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              class="w-4 h-4"
            >
              <path
                d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.925A1.5 1.5 0 005.135 9.25h6.115a.75.75 0 010 1.5H5.135a1.5 1.5 0 00-1.442 1.086l-1.414 4.926a.75.75 0 00.826.95 28.896 28.896 0 0015.252-7.325.75.75 0 000-1.153A28.859 28.859 0 003.105 2.289z"
              />
            </svg>
          </button>
        </form>
        <p class="text-center text-xs text-slate-400 mt-2">
          AI dapat membuat kesalahan. Periksa kembali informasi penting.
        </p>
      </div>
    </footer>

    <!-- JavaScript Handler -->
    <script>
      const chatContainer = document.getElementById('chat-container');
      const chatForm = document.getElementById('chat-form');
      const userInput = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');

      const API_URL = 'https://api.anoman.io/v1/chat/completions';
      const API_KEY = 'anm-sk-SfWNfdzF1n3AjczM2K5OtyDjgkGtd4rmyZkMBjZgMG0';
      const MODEL_NAME = 'free/deepseek-v4.1-flash';

      // Menyimpan riwayat percakapan
      let messages = [
        { role: 'system', content: 'You are a helpful AI assistant.' }
      ];

      // Auto-resize textarea
      userInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
      });

      // Submit via Enter (Shift+Enter untuk baris baru)
      userInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          chatForm.requestSubmit();
        }
      });

      chatForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        // Tambahkan pesan user ke UI
        appendMessage('user', text);
        messages.push({ role: 'user', content: text });
        
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        // Buat elemen loading/typing indicator
        const loadingId = appendLoadingIndicator();

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${API_KEY}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: MODEL_NAME,
              messages: messages
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();
          const reply = data.choices[0].message.content;

          // Hapus indikator loading
          document.getElementById(loadingId).remove();

          // Tampilkan balasan AI dan simpan ke riwayat
          appendMessage('assistant', reply);
          messages.push({ role: 'assistant', content: reply });

        } catch (error) {
          console.error(error);
          document.getElementById(loadingId).remove();
          appendMessage('assistant', 'Maaf, terjadi kesalahan saat menghubungi server.');
        } finally {
          sendBtn.disabled = false;
          userInput.focus();
        }
      });

      function appendMessage(role, text) {
        const isUser = role === 'user';
        const wrapper = document.createElement('div');
        wrapper.className = `flex items-start space-x-4 max-w-2xl mx-auto w-full ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = `w-8 h-8 rounded-lg flex items-center justify-center text-white font-semibold shrink-0 text-sm ${
          isUser ? 'bg-slate-700' : 'bg-emerald-600'
        }`;
        avatar.textContent = isUser ? 'R' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = `text-sm p-4 rounded-2xl border leading-relaxed shadow-2xs max-w-[80%] ${
          isUser
            ? 'bg-emerald-600 text-white border-emerald-600 rounded-tr-xs'
            : 'bg-white text-slate-800 border-slate-200 rounded-tl-xs'
        }`;
        
        // Render teks dengan newline terjaga
        bubble.style.whiteSpace = 'pre-wrap';
        bubble.textContent = text;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function appendLoadingIndicator() {
        const id = 'loading-' + Date.now();
        const wrapper = document.createElement('div');
        wrapper.id = id;
        wrapper.className = 'flex items-start space-x-4 max-w-2xl mx-auto w-full';

        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-semibold shrink-0 text-sm';
        avatar.textContent = 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bg-white text-slate-500 border border-slate-200 text-sm p-4 rounded-2xl rounded-tl-xs shadow-2xs flex items-center space-x-1.5 animate-pulse-slow';
        
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('span');
          dot.className = 'w-2 h-2 bg-slate-400 rounded-full inline-block animate-bounce';
          dot.style.animationDelay = `${i * 0.2}s`;
          bubble.appendChild(dot);
        }

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return id;
      }
    </script>
  </body>
</html>

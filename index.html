<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="flex h-screen flex-col bg-gray-50 text-gray-900">
    <header class="border-b bg-white px-5 py-4">
      <h1 class="font-semibold">Anoman AI</h1>
      <p id="status" class="text-sm text-gray-500">Menghubungkan ke Firebase…</p>
    </header>

    <main
      id="chat"
      class="mx-auto w-full max-w-3xl flex-1 space-y-4 overflow-y-auto p-4"
    ></main>

    <form id="form" class="mx-auto flex w-full max-w-3xl gap-2 p-4">
      <textarea
        id="input"
        class="min-h-12 flex-1 resize-y rounded-xl border bg-white p-3"
        placeholder="Tulis pesan…"
        required
      ></textarea>
      <button
        id="send"
        class="self-end rounded-xl bg-emerald-600 px-5 py-3 text-white disabled:opacity-50"
      >
        Kirim
      </button>
    </form>

    <script type="module">
      import { initializeApp } from
        "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        query,
        limitToLast,
        onChildAdded,
        get,
      } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDyJCI9Cd96KrBRA9oIeE8H2uqo14-VwsU",
        authDomain: "database-7c569.firebaseapp.com",
        databaseURL:
          "https://database-7c569-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "database-7c569",
        storageBucket: "database-7c569.firebasestorage.app",
        messagingSenderId: "865768447241",
        appId: "1:865768447241:web:dec2a481fcc7a7397947d8",
        measurementId: "G-HZY646942F",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // Satu ruang chat untuk contoh ini.
      const messagesRef = ref(db, "chats/demo/messages");
      const messagesQuery = query(messagesRef, limitToLast(100));

      const API_URL = "https://api.anoman.io/v1/chat/completions";

      // Jangan taruh API key rahasia di frontend untuk website publik.
      const API_KEY = "GANTI_DENGAN_API_KEY_BARU";

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendButton = document.getElementById("send");
      const status = document.getElementById("status");

      const history = [];
      const displayedIds = new Set();
      let ready = false;

      function showMessage(role, content) {
        const row = document.createElement("div");
        row.className =
          role === "user" ? "flex justify-end" : "flex justify-start";

        const bubble = document.createElement("div");
        bubble.className =
          "max-w-[85%] whitespace-pre-wrap rounded-2xl px-4 py-3 " +
          (role === "user"
            ? "bg-emerald-600 text-white"
            : "border bg-white text-gray-900");

        // textContent mencegah pesan diperlakukan sebagai HTML.
        bubble.textContent = content;
        row.appendChild(bubble);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
      }

      function showError(message) {
        showMessage("assistant", `Terjadi kesalahan: ${message}`);
      }

      // Ambil pesan lama dahulu supaya konteks AI benar saat halaman dibuka.
      try {
        const snapshot = await get(messagesQuery);

        snapshot.forEach((child) => {
          const message = child.val();
          if (!message?.role || typeof message.content !== "string") return;

          history.push({
            role: message.role,
            content: message.content,
          });

          displayedIds.add(child.key);
          showMessage(message.role, message.content);
        });

        // Listener menerima pesan baru setelah data awal dimuat.
        onChildAdded(messagesQuery, (child) => {
          if (displayedIds.has(child.key)) return;

          const message = child.val();
          if (!message?.role || typeof message.content !== "string") return;

          displayedIds.add(child.key);
          history.push({
            role: message.role,
            content: message.content,
          });
          showMessage(message.role, message.content);
        });

        ready = true;
        status.textContent = "Terhubung ke Firebase";
      } catch (error) {
        console.error("Firebase:", error);
        status.textContent = "Firebase gagal terhubung";
        showError(error.message);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = input.value.trim();
        if (!text || !ready) return;

        if (!API_KEY || API_KEY === "GANTI_DENGAN_API_KEY_BARU") {
          showError("Isi API_KEY untuk pengujian, atau gunakan backend.");
          return;
        }

        sendButton.disabled = true;
        input.value = "";

        try {
          await push(messagesRef, {
            role: "user",
            content: text,
            timestamp: Date.now(),
          });

          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${API_KEY}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              model: "free/deepseek-v4.1-flash",
              messages: [
                {
                  role: "system",
                  content: "You are a helpful assistant. Reply in Indonesian.",
                },
                ...history,
              ],
            }),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result?.error?.message ||
                result?.message ||
                `HTTP ${response.status}`,
            );
          }

          const reply = result?.choices?.[0]?.message?.content;
          if (typeof reply !== "string" || !reply.trim()) {
            throw new Error("Respons API tidak berisi teks balasan.");
          }

          await push(messagesRef, {
            role: "assistant",
            content: reply,
            timestamp: Date.now(),
          });
        } catch (error) {
          console.error("Chat:", error);
          showError(error.message);
        } finally {
          sendButton.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>

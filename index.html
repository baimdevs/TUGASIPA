<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roket Kali (Demo)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070914;--card:#11152a;--line:#232a4a;--tx:#eef0ff;--mu:#8087ad;--ac:#7c5cff;--ok:#2be48a;--bad:#ff4d6d;--gold:#ffc857}
*{box-sizing:border-box}html,body{background:var(--bg)}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:14px;max-width:480px;margin:auto;background:radial-gradient(circle at 50% -10%,#221a52 0,var(--bg) 55%)}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.top small{color:var(--mu);display:block;font-size:12px;letter-spacing:.5px}.top b{font-size:20px}
#stage{position:relative;padding:0;overflow:hidden;background:linear-gradient(#0b0e22,#12173a)}
canvas{display:block;width:100%;height:270px}
#m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 0 30px currentColor;transition:color .2s}
#msg{font-size:14px;font-weight:600;margin-top:4px;text-align:center;padding:0 10px}
#m.l{color:var(--bad)}#m.w{color:var(--ok)}
.label{color:var(--mu);font-size:12px;letter-spacing:.5px;margin-bottom:6px;display:block}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0a0d20;color:var(--tx);font-size:18px;font-weight:700;outline:none}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;margin:8px 0 12px}.row button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#0a0d20;color:var(--tx);font-weight:600}
.row button:active{background:var(--line)}
#go{width:100%;padding:17px;font-size:18px;font-weight:800;letter-spacing:.5px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#7c5cff,#4a7dff);box-shadow:0 8px 24px #5b4bff55;transition:.15s}
#go.cash{background:linear-gradient(135deg,#ffc857,#ff9f1c);color:#2a1a00;box-shadow:0 8px 24px #ffb70055}
#go.wait{background:var(--line);box-shadow:none;color:var(--mu)}
#go:active{transform:scale(.98)}
#hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#hist span{flex:none;padding:5px 10px;border-radius:20px;font-size:13px;font-weight:700;background:#0a0d20;border:1px solid var(--line)}
.w{color:var(--ok)}.l{color:var(--bad)}
.foot{text-align:center;color:var(--mu);font-size:12px}
#lock{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 0,#221a52,#070914 60%)}#lock h1{margin:0;font-size:26px}#lock input{max-width:320px;text-align:center;letter-spacing:2px;text-transform:uppercase}#lock button{width:100%;max-width:320px;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c5cff,#4a7dff)}#err{color:var(--bad);height:18px;font-size:14px}#bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#7c5cff,#ffc857)}#log div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}#log small{color:var(--mu)}#rst{background:none;border:0;color:var(--mu);font-size:12px;text-decoration:underline;margin:0 auto;display:block}</style></head><body>
<div id="lock"><div style="font-size:56px">🚀</div><h1>Roket Kali</h1><input id="code" placeholder="MASUKKAN KODE" autocomplete="off"><div id="err"></div><button id="ok">MASUK</button></div>
<div class="c top"><div><small>SALDO DEMO</small><b id="bal">Rp 100.000</b></div><div style="text-align:right"><small>PROFIT</small><b id="pf">Rp 0</b></div></div>
<div class="c" id="stage"><canvas id="cv"></canvas><div id="m">10s</div><div id="bar"></div></div>
<div id="msg"></div>
<div class="c" style="margin-top:12px">
<span class="label">TARUHAN (Rp)</span><input id="bet" type="number" inputmode="numeric" value="1000">
<div class="row"><button data-a="1000">1k</button><button data-a="5000">5k</button><button data-a="10000">10k</button><button id="mx">MAX</button></div>
<span class="label">AUTO CASH-OUT DI (x) — OPSIONAL</span><input id="auto" type="number" step="0.1" placeholder="cth 1.5">
<button id="go" style="margin-top:14px">PASANG TARUHAN</button></div>
<div class="c"><span class="label">RIWAYAT</span><div id="hist"></div></div>
<div class="c"><span class="label">RIWAYAT SALDO (TERSIMPAN)</span><div id="log"></div><button id="rst">Reset saldo & riwayat</button></div>
<p class="foot">Simulasi saldo virtual — bukan uang asli.</p>
<script>
const $=id=>document.getElementById(id),f=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr=devicePixelRatio||1;
function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size);
const stars=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.5+.3}));
const KEY='roket:v1',BASE=100000;
let S={bal:BASE,hist:[],log:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let start=0,crash=1,stake=0,state='bet',t=0,m=1,parts=[],exploded=false,cdEnd=performance.now()+10000;
function upd(){$('bal').textContent=f(S.bal);const p=S.bal-BASE;$('pf').textContent=(p>0?'+':'')+f(p);$('pf').className=p>=0?'w':'l'}
function renderHist(){$('hist').innerHTML=S.hist.map(x=>`<span class="${x>=2?'w':'l'}">${x.toFixed(2)}x</span>`).join('')||'<small style="color:var(--mu)">Belum ada</small>'}
function renderLog(){$('log').innerHTML=S.log.map(e=>`<div><span class="${e.d>=0?'w':'l'}">${e.d>=0?'+':''}${f(e.d)} <small>${e.x?e.x.toFixed(2)+'x':'meledak'}</small></span><small>saldo ${f(e.b)}</small></div>`).join('')||'<small>Belum ada taruhan</small>'}
function rec(d,x){S.log.unshift({d,x,b:S.bal});S.log=S.log.slice(0,20);save();renderLog()}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>$('bet').value=b.dataset.a);
$('mx').onclick=()=>$('bet').value=S.bal;
function pt(tt,X,Y){return[24+tt/X*(W-48),H-24-(Math.exp(.12*tt)-1)/(Y-1)*(H-60)]}
function draw(){
  ctx.clearRect(0,0,W,H);const now=performance.now();
  stars.forEach(s=>{ctx.globalAlpha=.4+.4*Math.sin(now/600+s.x*20);ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*H,s.s,s.s)});ctx.globalAlpha=1;
  const X=Math.max(6,t*1.15),Y=Math.max(2,m*1.25);
  ctx.strokeStyle='#ffffff10';ctx.lineWidth=1;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(0,H*i/5);ctx.lineTo(W,H*i/5);ctx.stroke()}
  if(state==='run'||exploded){
    const N=60,pts=[];for(let i=0;i<=N;i++)pts.push(pt(t*i/N,X,Y));
    const col=exploded?'#ff4d6d':'#7c5cff';
    const g=ctx.createLinearGradient(0,H,0,0);g.addColorStop(0,col+'00');g.addColorStop(1,col+'55');
    ctx.beginPath();ctx.moveTo(pts[0][0],H-24);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(pts[N][0],H-24);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=col;ctx.lineWidth=4;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.lineCap='round';ctx.stroke();ctx.shadowBlur=0;
    if(!exploded){const a=pts[N-1],b=pts[N],ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
      ctx.save();ctx.translate(b[0],b[1]);ctx.rotate(ang+Math.PI/4);ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚀',0,0);ctx.restore();
      const fl=ctx.createRadialGradient(b[0],b[1],0,b[0],b[1],26);fl.addColorStop(0,'#ffc85788');fl.addColorStop(1,'#ffc85700');ctx.fillStyle=fl;ctx.fillRect(b[0]-30,b[1]-30,60,60)}
  } else if(state==='bet'){ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚀',24+16,H-40)}
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.02;ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
}
function boom(){const p=pt(t,Math.max(6,t*1.15),Math.max(2,m*1.25));for(let i=0;i<50;i++){const a=Math.random()*6.28,s=Math.random()*5+1;parts.push({x:p[0],y:p[1],vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*3+1,l:1,c:['#ff4d6d','#ffc857','#ff9f1c'][i%3]})}}
function btn(x,c){$('go').textContent=x;$('go').className=c}
function newBet(){state='bet';cdEnd=performance.now()+10000;exploded=false;parts=[];t=0;m=1;stake=0;$('m').className='';btn('PASANG TARUHAN','');$('msg').className='';$('msg').textContent=S.bal<=0?'Saldo habis — reset saldo di bawah':'Pasang taruhan atau lewati ronde ini'}
function launch(){
  crash=Math.max(1,Math.floor(97/(1-Math.random()))/100);
  state='run';start=performance.now();$('bar').style.width='0';$('msg').className='';
  if(stake){$('msg').textContent='Taruhan '+f(stake)+' terpasang';btn('CASH OUT','cash')}else{$('msg').textContent='Kamu tidak pasang — menonton';btn('MENONTON…','wait')}
}
function cash(x){const win=Math.floor(stake*x);S.bal+=win;rec(win-stake,x);$('m').className='w';$('msg').textContent='✅ Cash out '+x.toFixed(2)+'x → '+f(win)+' masuk';$('msg').className='w';stake=0;btn('MENUNGGU LEDAKAN…','wait');upd()}
function loop(){
  const now=performance.now();
  if(state==='bet'){
    const rem=Math.max(0,(cdEnd-now)/1000);$('m').textContent=Math.ceil(rem)+'s';$('bar').style.width=(rem/10*100)+'%';
    if(rem<=0)launch();
  }else if(state==='run'){
    t=(now-start)/1000;m=Math.exp(.12*t);const a=parseFloat($('auto').value);
    if(m>=crash){m=crash;t=Math.log(crash)/.12;state='end';exploded=true;boom();
      $('m').textContent=crash.toFixed(2)+'x';$('m').className='l';
      if(stake){rec(-stake,0);$('msg').textContent='💥 Meledak! Taruhan '+f(stake)+' hangus';$('msg').className='l'}else{$('msg').textContent='💥 Meledak di '+crash.toFixed(2)+'x';$('msg').className='l'}
      S.hist.unshift(crash);S.hist=S.hist.slice(0,30);save();renderHist();stake=0;btn('RONDE BERIKUTNYA…','wait');upd();setTimeout(newBet,3000)}
    else{if(stake&&a>1&&m>=a)cash(a);$('m').textContent=m.toFixed(2)+'x'}
  }
  draw();requestAnimationFrame(loop)
}
$('go').onclick=()=>{
  if(state==='run'){if(stake)cash(m);return}
  if(state!=='bet')return;
  if(stake){S.bal+=stake;stake=0;save();upd();btn('PASANG TARUHAN','');$('msg').textContent='Taruhan dibatalkan';return}
  const b=Math.floor(+$('bet').value);
  if(!(b>0)||b>S.bal){$('msg').textContent='Taruhan tidak valid / saldo kurang';$('msg').className='l';return}
  S.bal-=b;stake=b;save();upd();$('msg').className='w';$('msg').textContent='Terpasang '+f(b)+' — ketuk lagi untuk batal';btn('BATALKAN TARUHAN','wait');
};
$('rst').onclick=()=>{if(state==='run'&&stake)return;S={bal:BASE,hist:[],log:[]};stake=0;save();upd();renderHist();renderLog();if(state==='bet')newBet()};
function unlock(){if($('code').value.trim().toUpperCase().replace(/\s+/g,' ')==='ROKET MASK'){$('lock').style.display='none'}else{$('err').textContent='Kode salah'}}
$('ok').onclick=unlock;$('code').onkeydown=e=>{if(e.key==='Enter')unlock()};
upd();renderHist();renderLog();newBet();loop();
</script></body></html>
